<tspan x="20" y="216" class="dim">└─ </tspan><tspan class="key">cat profile.txt</tspan>
<tspan x="20" y="242" class="dim">  </tspan><tspan class="key">OS      </tspan><tspan class="value">Arch Linux</tspan>

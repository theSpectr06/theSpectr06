<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="700px" height="680px" font-size="14px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
